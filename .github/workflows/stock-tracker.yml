name: Stock tracker

# GitHub starts this only every few hours on free accounts,
# so each run keeps checking every 5 minutes for almost 6 hours.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Discord"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: stock-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Check stock every 5 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FIRST_TEST: ${{ github.event.inputs.test }}
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          first=1
          while [ $SECONDS -lt 20400 ]; do
            if [ $first = 1 ]; then export TEST_MODE="$FIRST_TEST"; else export TEST_MODE=false; fi
            first=0
            python check_stock.py || echo "check failed, will retry"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update stock state"
              git pull -q --rebase || true
              git push -q || echo "push failed, will retry"
            fi
            sleep 300
          done
